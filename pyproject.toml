[project]
name = "billow"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
]

[dependency-groups]
dev = [
    "prek>=0.5.3",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "D1",     # missing docstrings
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "DJ001",  # nullable CharField is occasionally legitimate
    "RUF012", # Django Meta/class attrs are mutable by convention
    "TD002",  # no author required on TODOs
    "TD003",  # no issue link required on TODOs
    "FIX002", # TODOs are allowed
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101", "PLR2004", "ARG", "S105", "S106"]
"**/test_*.py" = ["S101", "PLR2004", "ARG", "S105", "S106"]
"**/conftest.py" = ["ARG"]
"manage.py" = ["INP001"]
"**/settings*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["billow"]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
docstring-code-format = true
