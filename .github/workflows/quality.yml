name: Quality

on:
  workflow_call:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    # Everything here only reads the checkout. Spelling that out keeps the
    # token read-only whatever the repository default is, which matters
    # because this workflow also runs on pull requests from forks.
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    # The suite runs against a real Postgres rather than a stand-in engine, so
    # one has to be here. The health check is what makes `uv run pytest` below
    # safe to start: without it the job races the server's first boot.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: billow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      # First, because it takes seconds and needs nothing installed: a
      # malformed workflow file should not surface only after the suite has
      # run against Postgres.
      - name: Lint the workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          curl -sSLf "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          ./actionlint

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Test
        env:
          DJANGO_DATABASE_URL: postgres://postgres:postgres@localhost:5432/billow_test
        run: uv run pytest

  # The one check `main` requires, and the only job here whose name is fixed.
  # A matrix job cannot be it: GitHub appends the matrix values to the job
  # name whatever `name` says, so every required context would carry a Python
  # version and bumping that version would silently retire the rule guarding
  # the branch. This job has no matrix, so its name is its own.
  gate:
    name: Test
    needs: test
    # `needs` alone would skip this job when the suite fails, and a skipped
    # check reports neutral, which GitHub counts as satisfying the rule. It
    # has to run in order to fail.
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the suite passed on every Python version
        # Covers failure and cancellation alike: anything other than success
        # across the whole matrix is not a green branch.
        if: needs.test.result != 'success'
        run: |
          echo "Test matrix result: ${{ needs.test.result }}"
          exit 1
